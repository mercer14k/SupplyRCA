<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484" role="img" aria-labelledby="title desc">
  <title id="title">SupplyRCA: from KPI decline to traceable evidence</title>
  <desc id="desc">Actual synthetic sample, SKU-001. Daily fill rate from March 23 through May 10, 2024. Baseline fill rate 100.0 percent; April 20 through May 10 fill rate 64.8 percent, with 591 unfilled units. Source: data/sample/dataset.json.gz, seed 42. This is an explanatory chart, not an application screenshot.</desc>
