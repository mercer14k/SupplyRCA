[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "supplyrca"
version = "0.1.0"
description = "Evidence-first supply chain root cause investigations"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.40,<1", "pydantic>=2.12,<3", "polars>=1.37,<2", "scipy>=1.17,<2", "ruptures>=1.1.10,<2", "sqlalchemy>=2.0.46,<3", "psycopg[binary]>=3.3,<4", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "pip-audit>=2.10,<3"]
[project.scripts]
supplyrca-generate = "supplyrca.data.generate:main"
supplyrca-benchmark = "supplyrca.evaluation.benchmark:main"
[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["supplyrca*", "apps.api*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
